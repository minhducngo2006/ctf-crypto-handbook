<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Crypto Field Guide</title>
  <desc id="desc">A clean editorial cover showing a four-step approach to solving cryptography CTF challenges.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f15"/>
      <stop offset="1" stop-color="#111c26"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bd5ff"/>
      <stop offset="0.42" stop-color="#79e2b4"/>
      <stop offset="0.72" stop-color="#f4c95d"/>
      <stop offset="1" stop-color="#ff8f70"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9e2ec" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="48" y="36" width="1104" height="3" rx="1.5" fill="url(#rule)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="52" y="76" fill="#91a4b7" font-size="13" font-weight="650" letter-spacing="2">CTF CRYPTOGRAPHY  /  FIELD NOTES</text>
    <text x="52" y="132" fill="#f3f5f7" font-size="42" font-weight="720" letter-spacing="-1.2">Crypto Field Guide</text>
    <text x="52" y="171" fill="#c4cdd6" font-size="22" font-weight="520">Read the code. Write the math.</text>

    <text x="52" y="213" fill="#8fa0af" font-size="15">
      <tspan x="52" dy="0">A compact handbook for turning challenge artifacts into</tspan>
      <tspan x="52" dy="23">small, testable solvers—and results you can explain.</tspan>
    </text>

    <g transform="translate(52 274)" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="650">
      <rect width="56" height="28" rx="7" fill="#8bd5ff" fill-opacity="0.12" stroke="#8bd5ff" stroke-opacity="0.32"/>
      <text x="28" y="18" text-anchor="middle" fill="#a9e0ff">RSA</text>
      <rect x="66" width="56" height="28" rx="7" fill="#79e2b4" fill-opacity="0.12" stroke="#79e2b4" stroke-opacity="0.32"/>
      <text x="94" y="18" text-anchor="middle" fill="#9aebc9">ECC</text>
      <rect x="132" width="58" height="28" rx="7" fill="#f4c95d" fill-opacity="0.12" stroke="#f4c95d" stroke-opacity="0.32"/>
      <text x="161" y="18" text-anchor="middle" fill="#f7d985">AES</text>
      <rect x="200" width="68" height="28" rx="7" fill="#ff8f70" fill-opacity="0.12" stroke="#ff8f70" stroke-opacity="0.32"/>
      <text x="234" y="18" text-anchor="middle" fill="#ffad97">PRNG</text>
      <rect x="278" width="94" height="28" rx="7" fill="#b8a1ff" fill-opacity="0.12" stroke="#b8a1ff" stroke-opacity="0.32"/>
      <text x="325" y="18" text-anchor="middle" fill="#c9b9ff">LATTICES</text>
    </g>

    <text x="52" y="330" fill="#667786" font-size="11" letter-spacing="1.1">AUTHORIZED CTFs &amp; LABS ONLY</text>
  </g>

  <g transform="translate(510 62)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="642" height="252" rx="18" fill="#111922" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="28" y="39" fill="#f1f4f6" font-size="17" font-weight="680">A practical solve path</text>
    <text x="614" y="39" text-anchor="end" fill="#6f8190" font-size="12" font-weight="600" letter-spacing="1.2">FOUR PASSES</text>
    <path d="M28 58H614" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M57 84V212" stroke="#ffffff" stroke-opacity="0.13" stroke-width="2"/>

    <g transform="translate(28 68)">
      <circle cx="29" cy="16" r="15" fill="#8bd5ff" fill-opacity="0.13" stroke="#8bd5ff" stroke-opacity="0.55"/>
      <text x="29" y="21" text-anchor="middle" fill="#a9e0ff" font-size="11" font-weight="750">01</text>
      <text x="66" y="12" fill="#edf2f5" font-size="15" font-weight="680">Read</text>
      <text x="66" y="30" fill="#8495a4" font-size="13">Source, bytes, lengths, and what is actually printed.</text>
    </g>

    <g transform="translate(28 110)">
      <circle cx="29" cy="16" r="15" fill="#79e2b4" fill-opacity="0.13" stroke="#79e2b4" stroke-opacity="0.55"/>
      <text x="29" y="21" text-anchor="middle" fill="#9aebc9" font-size="11" font-weight="750">02</text>
      <text x="66" y="12" fill="#edf2f5" font-size="15" font-weight="680">Model</text>
      <text x="66" y="30" fill="#8495a4" font-size="13">Encoding, equations, reused values, and exact bounds.</text>
    </g>

    <g transform="translate(28 152)">
      <circle cx="29" cy="16" r="15" fill="#f4c95d" fill-opacity="0.13" stroke="#f4c95d" stroke-opacity="0.55"/>
      <text x="29" y="21" text-anchor="middle" fill="#f7d985" font-size="11" font-weight="750">03</text>
      <text x="66" y="12" fill="#edf2f5" font-size="15" font-weight="680">Test</text>
      <text x="66" y="30" fill="#8495a4" font-size="13">One idea at a time, with a result that can fail clearly.</text>
    </g>

    <g transform="translate(28 194)">
      <circle cx="29" cy="16" r="15" fill="#ff8f70" fill-opacity="0.14" stroke="#ff8f70" stroke-opacity="0.58"/>
      <text x="29" y="21" text-anchor="middle" fill="#ffad97" font-size="11" font-weight="750">04</text>
      <text x="66" y="12" fill="#edf2f5" font-size="15" font-weight="680">Check</text>
      <text x="66" y="30" fill="#8495a4" font-size="13">Re-encrypt, replay, or run the real verifier.</text>
    </g>
  </g>
</svg>
